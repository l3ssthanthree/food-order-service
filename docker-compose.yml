services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitchen}
      POSTGRES_USER: ${POSTGRES_USER:-kitchen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitchen}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  kitchen:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen}?sslmode=disable
      KITCHEN_HTTP_ADDR: :8080
      KITCHEN_CALLBACK_TOKEN: ${KITCHEN_CALLBACK_TOKEN:-kitchen-callback-secret}
    ports:
      - "127.0.0.1:${KITCHEN_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 20

  demo-restaurant:
    build: .
    entrypoint: ["/app/demo-restaurant"]
    environment:
      DEMO_HTTP_ADDR: :8081
      KITCHEN_BASE_URL: http://kitchen:8080
      DEMO_RESTAURANT_TOKEN: ${DEMO_RESTAURANT_TOKEN:-demo-restaurant-secret}
      KITCHEN_CALLBACK_TOKEN: ${KITCHEN_CALLBACK_TOKEN:-kitchen-callback-secret}
    ports:
      - "127.0.0.1:${DEMO_PORT:-8081}:8081"
    depends_on:
      kitchen:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 20

  smoke:
    build: .
    profiles: ["test"]
    entrypoint: ["/app/smoke"]
    environment:
      KITCHEN_BASE_URL: http://kitchen:8080
      DEMO_BASE_URL: http://demo-restaurant:8081
      DEMO_RESTAURANT_TOKEN: ${DEMO_RESTAURANT_TOKEN:-demo-restaurant-secret}
    depends_on:
      demo-restaurant:
        condition: service_healthy

volumes:
  postgres-data:
