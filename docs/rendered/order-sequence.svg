"/><path d="M1431,647.0313 L1431,657.0313 L1441,657.0313 L1431,647.0313 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="283" x="774.75" y="665.5264">При потерянном ответе demo повторяет запрос</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="242" x="774.75" y="681.8779">с тем же event_id и сверяет GET заказа.</text><polygon fill="#A80036" points="444.5,724.0859,454.5,728.0859,444.5,732.0859,448.5,728.0859" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="146.5" x2="450.5" y1="728.0859" y2="728.0859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="92" x="153.5" y="723.2295">GET /orders/{id}</text><polygon fill="#A80036" points="157.5,754.4375,147.5,758.4375,157.5,762.4375,153.5,758.4375" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="151.5" x2="455.5" y1="758.4375" y2="758.4375"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="80" x="163.5" y="753.5811">current status</text><path d="M105,771.4375 L105,830.4375 L1431,830.4375 L1431,781.4375 L1421,771.4375 L105,771.4375 " fill="#FBFB77" filter="url(#f7bhe2g9baeqc)" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M1421,771.4375 L1421,781.4375 L1431,781.4375 L1421,771.4375 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="299" x="597.5" y="789.9326">preparing: приготовление; ready: готов к доставке.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="328" x="597.5" y="806.2842">completed подтверждает вручение еды пользователю.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="318" x="597.5" y="822.6357">Доставку организует заведение; demo имитирует её.</text><!--
@startuml
title Создание и исполнение заказа
actor User
participant Web
participant "Kitchen API" as Kitchen
database PostgreSQL as DB
participant "Outbox dispatcher" as Outbox
participant "Demo Restaurant" as Restaurant

User -> Web : Оформить заказ
Web -> Kitchen : POST /orders (X-Avito-User-ID, Idempotency-Key)
Kitchen -> DB : BEGIN + advisory lock
Kitchen -> DB : restaurant FOR SHARE; menu_items FOR UPDATE
Kitchen -> DB : INSERT order, snapshots, status event and outbox; UPDATE stock
Kitchen -> DB : COMMIT
Kitchen - -> Web : 201 pending_restaurant

Outbox -> DB : claim event FOR UPDATE SKIP LOCKED
Outbox -> Restaurant : POST /integration/v1/events\norder.created + event_id + Bearer token
alt Restaurant unavailable
  Outbox -> DB : reschedule with backoff
else Received
  Restaurant - -> Outbox : 202 Accepted
  Outbox -> DB : mark delivered
  Restaurant -> Kitchen : POST status accepted + event_id + Bearer token
  Kitchen -> DB : validate transition + persist event
  Kitchen - -> Restaurant : 200 accepted
  note over Restaurant, Kitchen
    При потерянном ответе demo повторяет запрос
    с тем же event_id и сверяет GET заказа.
  end note
end

Web -> Kitchen : GET /orders/{id}
Kitchen - -> Web : current status
note over Web, Restaurant
  preparing: приготовление; ready: готов к доставке.
  completed подтверждает вручение еды пользователю.
  Доставку организует заведение; demo имитирует её.
end note
@enduml

